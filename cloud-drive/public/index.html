<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云盘协作 · CloudDrive</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="view-login" class="login-wrap hidden">
  <div class="login-card">
    <div class="brand"><span class="brand-logo">☁</span> 云盘协作系统</div>
    <p class="login-sub">选择身份快速体验，或输入昵称创建新用户</p>
    <div id="quick-users" class="quick-users"></div>
    <div class="login-row">
      <input id="login-name" type="text" placeholder="输入昵称…" maxlength="20">
      <button id="btn-login" class="btn btn-primary">进入网盘</button>
    </div>
  </div>
</div>

<!-- ========== DRIVE ========== -->
<div id="view-drive" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand"><span class="brand-logo">☁</span><span>云盘协作</span></div>
    <nav class="side-nav">
      <a data-nav="files" class="nav-item active">📁 全部文件</a>
      <a data-nav="shares" class="nav-item">🔗 我的分享</a>
      <a data-nav="activity" class="nav-item">🕘 协作动态</a>
    </nav>
    <div class="side-section">
      <div class="side-title">目录</div>
      <div id="tree" class="tree"></div>
    </div>
    <div class="side-user">
      <div id="user-avatar" class="avatar">A</div>
      <div class="user-meta"><div id="user-name"></div><div class="user-sub">协作者</div></div>
      <button id="btn-logout" class="icon-btn" title="退出">⎋</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="crumbs" class="crumbs"></div>
      <div class="topbar-actions">
        <button id="btn-newfolder" class="btn">＋ 新建文件夹</button>
        <button id="btn-upload" class="btn btn-primary">⬆ 上传文件</button>
        <input id="file-input" type="file" multiple hidden>
      </div>
    </header>

    <section id="dropzone" class="content">
      <div id="file-list" class="file-list"></div>
      <div id="empty-state" class="empty hidden">
        <div class="empty-icon">🗂</div>
        <p>这里还没有文件，拖拽文件到此处或点击上传</p>
      </div>
      <div class="drop-hint hidden" id="drop-hint">松开以上传到当前目录</div>
    </section>

    <!-- shares panel -->
    <section id="panel-shares" class="content hidden">
      <h2 class="panel-title">我的分享</h2>
      <div id="shares-list"></div>
    </section>

    <!-- activity panel -->
    <section id="panel-activity" class="content hidden">
      <h2 class="panel-title">协作动态</h2>
      <div id="activity-list" class="activity-list"></div>
    </section>
  </main>
</div>

<!-- ========== ONLYOFFICE EDITOR ========== -->
<div id="view-editor" class="editor-wrap hidden">
  <div class="editor-bar">
    <button id="btn-close-editor" class="btn">← 返回网盘</button>
    <div id="editor-title" class="editor-title"></div>
    <span id="editor-mode" class="mode-badge"></span>
  </div>
  <div id="editor-hint" class="editor-hint hidden">
    未检测到 OnlyOffice Document Server。请启动它：<br>
    <code>docker run -d -p 8080:80 onlyoffice/documentserver</code><br>
    并通过环境变量 <code>ONLYOFFICE_DS_URL</code> 指定地址后重启服务。
  </div>
  <div id="onlyoffice-placeholder" class="editor-frame"></div>
</div>

<!-- ========== SHARE PAGE (guest) ========== -->
<div id="view-share" class="app hidden">
  <main class="main share-main">
    <header class="topbar">
      <div class="crumbs"><span class="crumb current" id="share-title">共享内容</span></div>
      <div class="topbar-actions"><span id="share-mode-badge" class="mode-badge"></span></div>
    </header>
    <section class="content"><div id="share-list" class="file-list"></div></section>
  </main>
</div>

<!-- ========== MODALS ========== -->
<div id="modal-mask" class="modal-mask hidden">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn">取消</button>
      <button id="modal-ok" class="btn btn-primary">确定</button>
    </div>
  </div>
</div>

<!-- context menu -->
<div id="ctx-menu" class="ctx hidden"></div>

<div id="toast" class="toast hidden"></div>

<script src="/js/app.js"></script>
</body>
</html>
